# Rival-model calibration. One job per configuration; the table job sets each rival's
# simulated numbers beside its live ones, one column per configuration.
#
# entries v4c or v4 (bot-starter/src/selfplay.ts validate4): the v4 rivals play each other
# six to a table, drawn as at the live m300 to m390 tables, once per rack awareness rho.
#
# entries v5c, v5, v5u, v5p or v5k (validate5): the live all-real tables from m1000 on are
# replayed with the v5 fits (each rival meets the opponents it met live); v5k is the
# calibrated model (selfplay.ts V5_CALIBRATION). A configuration is a rho ("-" keeps each
# entry's fitted rho), optionally followed by ":" and rival model modifiers joined by "+"
# (selfplay.ts RIVAL_MODS, e.g. "0.7:shark" or "-:minlen=7+bidx=1.1").
#
# rounds N > 0 (entries v5p, v5u or v5c): each job fits per-rival bid scales with selfplay.ts
# calibrate5, N rounds of the replay above, so each rival's simulated score meets its live
# one; a configuration is then a damping exponent gamma, optionally :mod+mod. The last
# round's scales go to selfplay.ts V5_CALIBRATION.bidScale (then validate entries v5k).
#
#   gh workflow run calibrate.yml --repo StephenSook/sookrabot --ref harness-sync \
#     -f matches=400 -f seed=1 -f rhos="- 0.5 0.7 0.9" -f entries=v4c
#   gh workflow run calibrate.yml --repo StephenSook/sookrabot --ref round2-harness \
#     -f matches=864 -f seed=1 -f rhos="- 0.7 -:shark" -f entries=v5c
#   gh workflow run calibrate.yml --repo StephenSook/sookrabot --ref round2-harness \
#     -f matches=576 -f seed=11 -f rhos="0.8" -f entries=v5u -f rounds=6
name: calibrate
run-name: "calibrate ${{ inputs.entries }} x${{ inputs.matches }} seed ${{ inputs.seed }}: ${{ inputs.rhos }} (fit rounds ${{ inputs.rounds }})"

on:
  workflow_dispatch:
    inputs:
      matches:
        description: "Matches per configuration"
        required: true
        default: "400"
        type: string
      seed:
        description: "Seed"
        required: true
        default: "1"
        type: string
      rhos:
        description: "Configurations, space-separated: a rho (- keeps each entry's fitted rho), for v5 entries optionally :mod+mod"
        required: true
        default: "- 0.5 0.7 0.9"
        type: string
      entries:
        description: "Fixture entries: v4c or v4 (validate4), v5c, v5, v5u, v5p or v5k (validate5)"
        required: true
        default: v4c
        type: string
      rounds:
        description: "0 validates; N > 0 fits per-rival bid scales in N rounds (calibrate5; entries v5u or v5c, configurations gamma[:mod+mod])"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rhos: ${{ steps.plan.outputs.rhos }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Check the inputs
        id: plan
        shell: bash
        env:
          MATCHES: ${{ inputs.matches }}
          SEED: ${{ inputs.seed }}
          RHOS: ${{ inputs.rhos }}
          ENTRIES: ${{ inputs.entries }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$ROUNDS" =~ ^[0-9]{1,2}$ ]] && (( ROUNDS <= 20 )) || fail "rounds: 0 to 20, got '$ROUNDS'"
          [[ "$MATCHES" =~ ^[1-9][0-9]{0,4}$ ]] && (( MATCHES <= 20000 )) || fail "matches: 1 to 20000, got '$MATCHES'"
          [[ "$SEED" =~ ^[0-9]{1,9}$ ]] || fail "seed: a whole number from 0 to 999999999, got '$SEED'"
          case "$ENTRIES" in
            v4c|v4) mode=validate4 ;;
            v5c|v5|v5u|v5p|v5k) mode=validate5 ;;
            *) fail "entries: v4c, v4, v5c, v5, v5u, v5p or v5k, got '$ENTRIES'" ;;
          esac
          if (( ROUNDS > 0 )); then
            [[ "$ENTRIES" == v5u || "$ENTRIES" == v5c || "$ENTRIES" == v5p ]] || fail "rounds > 0 fits v5p, v5u or v5c entries, got '$ENTRIES'"
            mode=calibrate5
          fi
          read -r -a R <<< "$RHOS"
          (( ${#R[@]} >= 1 && ${#R[@]} <= 12 )) || fail "rhos: 1 to 12 configurations"
          for r in "${R[@]}"; do
            if [[ "$mode" == calibrate5 ]]; then
              [[ "$r" =~ ^(0\.[0-9]{1,3}|1(\.[0-9]{1,3})?|2)(:[a-z0-9]+(=[0-9]+(\.[0-9]+)?)?(\+[a-z0-9]+(=[0-9]+(\.[0-9]+)?)?)*)?$ ]] \
                || fail "configuration '$r': a gamma in (0, 2], optionally :mod+mod"
            elif [[ "$mode" == validate5 ]]; then
              [[ "$r" =~ ^(-|0(\.[0-9]{1,4})?)(:[a-z0-9]+(=[0-9]+(\.[0-9]+)?)?(\+[a-z0-9]+(=[0-9]+(\.[0-9]+)?)?)*)?$ ]] \
                || fail "configuration '$r': a rho (- or a number in [0, 1)), optionally :mod+mod"
            else
              [[ "$r" == "-" || "$r" =~ ^0(\.[0-9]{1,4})?$ ]] || fail "rho '$r': - or a number in [0, 1)"
            fi
          done
          echo "rhos=$(printf '%s\n' "${R[@]}" | jq -R . | jq -cs 'unique')" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  rho:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        rho: ${{ fromJSON(needs.plan.outputs.rhos) }}
    name: rho ${{ matrix.rho }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check this ref carries the validation mode
        shell: bash
        env:
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          if ! grep -q "export async function $MODE" bot-starter/src/selfplay.ts 2>/dev/null; then
            echo "::error::$GITHUB_REF_NAME has no $MODE; dispatch with --ref harness-sync (validate4) or round2-harness (validate5)"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot-starter/package-lock.json
      - name: Install
        working-directory: bot-starter
        run: npm ci --no-audit --no-fund
      - name: Play
        id: play
        working-directory: bot-starter
        shell: bash
        env:
          MATCHES: ${{ inputs.matches }}
          SEED: ${{ inputs.seed }}
          CONFIG: ${{ matrix.rho }}
          ENTRIES: ${{ inputs.entries }}
          MODE: ${{ needs.plan.outputs.mode }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          rho=${CONFIG%%:*}
          mods=""
          [[ "$CONFIG" == *:* ]] && mods=${CONFIG#*:}
          label=$([[ "$rho" == "-" ]] && echo fitted || echo "$rho")
          [[ "$MODE" == calibrate5 ]] && label="fit-gamma$rho"
          [[ -n "$mods" ]] && label="$label-$(echo "$mods" | tr -c 'A-Za-z0-9.\n' '_')"
          mkdir -p "$RUNNER_TEMP/calib"
          out="$RUNNER_TEMP/calib/$MODE-$GITHUB_RUN_ID-$ENTRIES-rho-$label.jsonl"
          start=$(date +%s)
          if [[ "$MODE" == calibrate5 ]]; then
            npx tsx src/selfplay.ts calibrate5 "$ROUNDS" "$MATCHES" "$SEED" "$ENTRIES" "${mods:--}" "$rho" > "$out"
          elif [[ "$MODE" == validate5 ]]; then
            npx tsx src/selfplay.ts validate5 "$MATCHES" "$SEED" "$rho" "$ENTRIES" "$mods" > "$out"
          else
            npx tsx src/selfplay.ts validate4 "$MATCHES" "$SEED" "$rho" "$ENTRIES" > "$out"
          fi
          echo "configuration $CONFIG: $(wc -l < "$out") rivals, $MATCHES matches in $(( $(date +%s) - start )) s"
          cat "$out"
          [ -s "$out" ] || { echo "::error::$MODE wrote nothing"; exit 1; }
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: validate-${{ github.run_id }}-${{ inputs.entries }}-rho-${{ steps.play.outputs.label }}
          path: ${{ runner.temp }}/calib/
          if-no-files-found: error
          retention-days: 30

  table:
    needs: rho
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: bot-starter/scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: validate-${{ github.run_id }}-*
          path: calib
          merge-multiple: true
      - name: Table
        shell: bash
        run: |
          mkdir -p result
          python3 bot-starter/scripts/selfplay_aggregate.py calib > result/result.txt
          python3 bot-starter/scripts/selfplay_aggregate.py calib --format=markdown > result/result.md
          cp calib/*.jsonl result/
          cat result/result.txt
          cat result/result.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: calibration-${{ github.run_id }}-${{ inputs.entries }}
          path: result/
          if-no-files-found: error
          retention-days: 30
